<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="복싱 루틴">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<title>복싱 주간 루틴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 기억 앱과 같은 틀: 요일 알약 탭, 큰 글씨 목록, 오른쪽 아래 흰 + 버튼, 아래에서 올라오는 시트 */
  :root {
    --bg: #000;
    --ink: #f4f4f2;
    --soft: #8c8c8c;
    --faint: #3a3a3a;
    --sheet: #1a1a1a;
    --spring: cubic-bezier(.34, 1.4, .5, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { touch-action: pan-x pan-y; }
  body {
    font-family: "Toss Product Sans", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 140px; }

  /* 요일 */
  .days { display: flex; gap: 6px; margin: 0 -6px 30px; }
  .day {
    flex: 1; font-size: 19px; font-weight: 600; padding: 10px 0; border-radius: 999px;
    color: var(--soft); position: relative;
    transition: background .35s var(--ease), color .35s var(--ease), transform .25s var(--spring);
  }
  .day:active { transform: scale(.93); }
  .day.on { background: var(--ink); color: #000; font-weight: 700; }
  .day.today::after {
    content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: currentColor; opacity: .6;
  }

  /* 목록 */
  .list { transition: opacity .2s ease, transform .3s var(--ease); }
  .list.swap { opacity: 0; transform: translateY(8px); }
  .item {
    padding: 12px 0 14px;
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows .4s var(--ease), opacity .3s ease, padding .4s var(--ease);
  }
  .item > div { overflow: hidden; display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 14px; align-items: start; }
  .item.gone { grid-template-rows: 0fr; opacity: 0; padding: 0; }
  .item.fresh { animation: pop .7s var(--spring); }
  @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(6px); } }

  .check {
    width: 34px; height: 34px; margin-top: 3px; border-radius: 50%;
    border: 2.5px solid var(--faint); display: grid; place-items: center;
    transition: background .25s var(--ease), border-color .25s var(--ease), transform .3s var(--spring);
  }
  .check:active { transform: scale(.88); }
  .check svg { width: 17px; height: 17px; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .35s var(--spring); }
  .item.done .check { background: var(--ink); border-color: var(--ink); }
  .item.done .check svg { opacity: 1; transform: none; }

  .text {
    font-size: 29px; font-weight: 700; line-height: 1.35; letter-spacing: -0.03em;
    word-break: keep-all; overflow-wrap: anywhere; cursor: default;
    transition: color .3s ease;
  }
  .item.done .text { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 2px; }
  .del {
    grid-column: 2; justify-self: start;
    display: block; font-size: 15px; line-height: 1; color: var(--soft);
    height: 0; margin-top: 0; padding: 0 12px; overflow: hidden;
    border-radius: 999px; background: var(--sheet);
    opacity: 0; pointer-events: none;
    transition: height .3s var(--ease), margin .3s var(--ease), padding .3s var(--ease), opacity .25s ease, background .2s, color .2s;
  }
  .item.open .del { height: 30px; margin-top: 8px; padding: 7px 12px; opacity: 1; pointer-events: auto; }
  .del.sure { background: #3a1414; color: #ffb4b4; }

  .empty { padding: 70px 0; text-align: center; color: var(--faint); font-size: 22px; line-height: 1.7; }

  /* 플러스 버튼 */
  .fab {
    position: fixed; right: max(22px, calc(50vw - 338px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--ink); color: #000; z-index: 20;
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(255,255,255,.12);
    transition: transform .45s var(--spring), opacity .25s ease;
  }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 28px; height: 28px; transition: transform .45s var(--spring); }
  body.writing .fab svg { transform: rotate(135deg); }

  /* 입력 시트 */
  .dim {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    max-width: 720px; margin: 0 auto;
    background: var(--sheet); border-radius: 28px 28px 0 0;
    padding: 26px 22px calc(110px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .5s var(--ease);
  }
  body.writing .dim { opacity: 1; pointer-events: auto; }
  body.writing .sheet { transform: none; transition-timing-function: var(--spring); }
  .sheet .for { font-size: 16px; font-weight: 600; color: var(--soft); margin-bottom: 10px; }
  .sheet input { display: block; width: 100%; font-size: 26px; font-weight: 600; line-height: 1.5; padding: 4px 0 40px; }
  ::placeholder { color: #555; }
  .save {
    position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    height: 66px; padding: 0 30px; border-radius: 999px; font-size: 20px; font-weight: 700;
    background: #2c2c2c; color: var(--soft);
    transition: background .25s, color .25s, transform .3s var(--spring);
  }
  .save.ready { background: var(--ink); color: #000; }
  .save:active { transform: scale(.94); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>

<main class="wrap">
  <nav class="days" id="days" aria-label="요일"></nav>
  <section class="list" id="list"></section>
</main>

<div class="dim" id="dim"></div>
<form class="sheet" id="sheet" aria-hidden="true" autocomplete="off">
  <p class="for" id="for">월요일</p>
  <input id="text" maxlength="80" placeholder="추가할 운동을 적어줘" enterkeyhint="done" aria-label="추가할 운동">
  <button class="save" id="save" type="submit">추가</button>
</form>

<button class="fab" id="fab" type="button" aria-label="운동 추가">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script>
(() => {
  /* 확대 막기 (아이폰 사파리는 viewport 설정을 무시해서 따로 막음) */
  ["gesturestart", "gesturechange", "gestureend"].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  const $ = id => document.getElementById(id);
  const DAYS = ["월", "화", "수", "목", "금"];
  const todayIdx = () => (new Date().getDay() + 6) % 7;      // 5,6 = 주말
  // 체크는 매주 월요일에 새로 시작
  function weekKey(d = new Date()) {
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    return `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, "0")}-${String(m.getDate()).padStart(2, "0")}`;
  }
  let items = new Map(), col = null, sel = todayIdx() > 4 ? 0 : todayIdx(), freshId = null;
  const isDone = it => it.doneWeek === weekKey();

  /* 저장: Claude에서는 클라우드, 그 밖에서는 이 기기 */
  const LS = "boxing-routine:v1";
  const loadLocal = () => { try { const r = localStorage.getItem(LS); if (r) items = new Map(Object.entries(JSON.parse(r))); } catch (e) {} };
  const saveLocal = () => { if (col) return; try { localStorage.setItem(LS, JSON.stringify(Object.fromEntries(items))); } catch (e) {} };
  const newId = () => col ? col.doc().id : Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  async function write(id, data) {
    if (!col) { saveLocal(); return; }
    const ref = col.doc(id), go = () => data ? ref.set(data) : ref.delete();
    try { await go(); } catch (e) { await new Promise(r => setTimeout(r, 600)); try { await go(); } catch (_) {} }
  }

  /* 화면 */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const checkSvg = '<svg viewBox="0 0 14 14" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4 5.6 10.3 11.5 3.8"/></svg>';

  function renderDays() {
    $("days").innerHTML = DAYS.map((d, i) =>
      `<button class="day ${i === sel ? "on" : ""} ${i === todayIdx() ? "today" : ""}" data-i="${i}" type="button">${d}</button>`).join("");
  }
  function renderList() {
    const list = [...items.entries()].filter(([, it]) => it.day === sel).sort((a, b) => a[1].createdAt - b[1].createdAt);
    $("list").innerHTML = list.length
      ? list.map(([id, it]) => `<article class="item ${isDone(it) ? "done" : ""} ${id === freshId ? "fresh" : ""}" data-id="${esc(id)}"><div>
          <button class="check" type="button" role="checkbox" aria-checked="${isDone(it)}" aria-label="${esc(it.name)}">${checkSvg}</button>
          <p class="text">${esc(it.name)}</p>
          <button class="del" type="button">지우기</button>
        </div></article>`).join("")
      : `<div class="empty">${DAYS[sel]}요일은 아직 비어 있어<br>아래 + 를 눌러 적어봐</div>`;
    freshId = null;
  }
  function render() { renderDays(); renderList(); }

  $("days").onclick = e => {
    const b = e.target.closest(".day"); if (!b) return;
    const i = +b.dataset.i; if (i === sel) return;
    sel = i; renderDays();
    const l = $("list"); l.classList.add("swap");
    setTimeout(() => { renderList(); l.classList.remove("swap"); }, 180);
  };

  /* 시트 */
  const open = () => {
    $("for").textContent = DAYS[sel] + "요일";
    document.body.classList.add("writing"); $("sheet").setAttribute("aria-hidden", "false");
    setTimeout(() => $("text").focus(), 120);
  };
  const close = () => {
    document.body.classList.remove("writing"); $("sheet").setAttribute("aria-hidden", "true");
    if (document.activeElement) document.activeElement.blur();
  };
  $("fab").onclick = () => document.body.classList.contains("writing") ? close() : open();
  $("dim").onclick = close;
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  $("text").oninput = () => $("save").classList.toggle("ready", !!$("text").value.trim());

  $("sheet").onsubmit = e => {
    e.preventDefault();
    const name = $("text").value.trim().replace(/\s+/g, " "); if (!name) { $("text").focus(); return; }
    const id = newId(), data = { day: sel, name: name.slice(0, 80), doneWeek: "", createdAt: Date.now() };
    items.set(id, data); freshId = id; write(id, data);
    $("text").value = ""; $("save").classList.remove("ready");
    close();
    setTimeout(renderList, 220);
  };

  /* 동그라미 누르면 체크, 글 누르면 지우기 버튼, 두 번 누르면 삭제 */
  const resetDel = x => { x.classList.remove("open"); const d = x.querySelector(".del"); d.classList.remove("sure"); d.textContent = "지우기"; };
  $("list").onclick = e => {
    const el = e.target.closest(".item"); if (!el) return;
    const id = el.dataset.id, it = items.get(id); if (!it) return;
    if (e.target.closest(".check")) {
      const data = { ...it, doneWeek: isDone(it) ? "" : weekKey() };
      items.set(id, data); write(id, data);
      el.classList.toggle("done", isDone(data));
      el.querySelector(".check").setAttribute("aria-checked", String(isDone(data)));
      return;
    }
    const del = e.target.closest(".del");
    if (del) {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "정말 지울까?"; return; }
      el.classList.add("gone"); items.delete(id); write(id, null);
      setTimeout(renderList, 420);
      return;
    }
    document.querySelectorAll(".item.open").forEach(x => { if (x !== el) resetDel(x); });
    if (el.classList.contains("open")) resetDel(el); else el.classList.add("open");
  };

  setInterval(() => { if (!document.body.classList.contains("writing")) renderDays(); }, 60000);

  async function connect() {
    const c = window.claude;
    let db = null;
    if (c && c.use) { try { db = await c.use("db"); } catch (e) {} }
    if (!db) { loadLocal(); render(); return; }
    col = db.collection("routine");
    col.onSnapshot(snap => {
      const next = new Map();
      snap.docs.forEach(d => {
        const v = d.data();
        if (v && typeof v.name === "string" && v.day >= 0 && v.day <= 4)
          next.set(d.id, { day: +v.day, name: v.name, doneWeek: String(v.doneWeek || ""), createdAt: +v.createdAt || 0 });
      });
      items = next; renderList();
    }, () => {});
  }
  loadLocal(); render();
  connect();
})();
</script>

</body>
</html>
